<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>單字測驗 1–160</title>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1C1A15; --ink-soft:#6B665A;
    --line:#E5E0D4; --hl:#FFE24A; --hl-deep:#F2C500;
    --ok:#2E7D5B; --ok-bg:#E3F3EA; --no:#C0392B; --no-bg:#FBE7E4; --card:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    line-height:1.6;padding-bottom:96px;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 0;}
  header{padding:8px 0 20px;}
  .kicker{font-size:12px;letter-spacing:.28em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;}
  h1{font-size:30px;font-weight:800;margin:6px 0 2px;letter-spacing:-.01em;}
  .mark{background:linear-gradient(120deg,var(--hl),var(--hl));background-repeat:no-repeat;background-size:100% 42%;background-position:0 78%;padding:0 2px;}
  .sub{color:var(--ink-soft);font-size:14px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:16px;}
  .panel h2{font-size:13px;letter-spacing:.14em;color:var(--ink-soft);font-weight:700;margin:0 0 12px;text-transform:uppercase;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .chip{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer;user-select:none;transition:.15s;background:var(--paper);}
  .chip.wide{grid-column:1/-1;}
  .chip .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-soft);flex:0 0 auto;position:relative;transition:.15s;}
  .chip.on{border-color:var(--ink);background:#fff;}
  .chip.on .box{background:var(--hl);border-color:var(--hl-deep);}
  .chip.on .box::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(42deg);}
  .count-row{display:flex;gap:10px;}
  .range-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .count-row button,.range-grid button{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 0;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;transition:.15s;font-family:inherit;}
  .count-row button.on,.range-grid button.on{border-color:var(--ink);background:var(--hl);}
  .custom{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .custom span{color:var(--ink-soft);font-weight:700;flex:0 0 auto;}
  .custom input{width:100%;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:11px 8px;font-size:16px;font-weight:700;background:var(--paper);color:var(--ink);font-family:inherit;outline:none;transition:.15s;}
  .custom input:focus{border-color:var(--ink);background:#fff;}
  .hint{margin-top:10px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .hint b{color:var(--ink);}
  .hint.warn b{color:var(--no);}
  .start{width:100%;margin-top:16px;border:none;border-radius:14px;background:var(--ink);color:var(--paper);font-size:17px;font-weight:800;padding:16px 0;cursor:pointer;font-family:inherit;letter-spacing:.02em;}
  .start:active{transform:translateY(1px);}
  .start:disabled{opacity:.4;cursor:not-allowed;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 15px;margin-bottom:14px;}
  .q-top{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
  .q-num{font-size:13px;font-weight:800;color:var(--ink);background:var(--hl);border-radius:8px;padding:2px 9px;flex:0 0 auto;}
  .q-type{font-size:12px;letter-spacing:.12em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;}
  .prompt{font-size:22px;font-weight:700;margin:2px 0 14px;word-break:break-word;}
  .prompt small{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin-top:4px;letter-spacing:.06em;}
  .prompt.cloze{font-size:19px;font-weight:600;line-height:1.7;}
  .blank{border-bottom:2.5px solid var(--hl-deep);padding:0 22px;margin:0 2px;}
  .blanks{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;}
  .opts{display:grid;gap:9px;}
  .opt{border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;cursor:pointer;background:var(--paper);transition:.12s;display:flex;gap:10px;align-items:center;}
  .opt .k{font-weight:800;color:var(--ink-soft);flex:0 0 auto;}
  .opt.sel{border-color:var(--ink);background:var(--hl);font-weight:600;}
  input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:17px;background:var(--paper);color:var(--ink);font-family:inherit;outline:none;transition:.15s;}
  input[type=text]:focus{border-color:var(--ink);background:#fff;}
  .q.correct{border-color:var(--ok);}
  .q.wrong{border-color:var(--no);}
  .verdict{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:700;}
  .verdict.ok{color:var(--ok);} .verdict.no{color:var(--no);}
  .verdict .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;flex:0 0 auto;}
  .verdict.ok .dot{background:var(--ok);} .verdict.no .dot{background:var(--no);}
  .answer{margin-top:8px;font-size:15px;color:var(--ink);background:var(--ok-bg);border-radius:10px;padding:9px 12px;line-height:1.6;}
  .answer b{background:linear-gradient(120deg,var(--hl),var(--hl));background-repeat:no-repeat;background-size:100% 45%;background-position:0 72%;padding:0 2px;}
  .opt.ans{border-color:var(--ok);background:var(--ok-bg);font-weight:700;}
  .opt.badpick{border-color:var(--no);background:var(--no-bg);}
  .selfscore{margin-top:10px;font-size:14px;color:var(--ink-soft);}
  .selfscore button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
  .selfscore button.on{background:var(--ok);color:#fff;border-color:var(--ok);}
  .score{background:var(--ink);color:var(--paper);border-radius:16px;padding:20px 18px;margin-bottom:16px;text-align:center;}
  .score .big{font-size:46px;font-weight:800;line-height:1;}
  .score .big span{color:var(--hl);}
  .score .lbl{font-size:14px;color:#C9C4B6;margin-top:6px;letter-spacing:.06em;}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,250,246,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
  .bar .inner{max-width:640px;margin:0 auto;display:flex;gap:10px;}
  .bar button{flex:1;border:none;border-radius:14px;padding:15px 0;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}
  .btn-check{background:var(--hl);color:var(--ink);}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)!important;flex:0 0 auto;padding-left:20px;padding-right:20px;}
  .btn-dark{background:var(--ink);color:var(--paper);}
  .hidden{display:none;}
  .foot{text-align:center;color:var(--ink-soft);font-size:12px;padding:8px 0 20px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Vocabulary · 1–160</div>
    <h1>單字<span class="mark">測驗</span></h1>
    <div class="sub" id="hdrSub">選好題型和題數，開始練習。</div>
  </header>

  <div id="setup">
    <div class="panel">
      <h2>範圍</h2>
      <div class="range-grid" id="rangeRow">
        <button data-all="1" class="on">全部</button>
        <button data-from="1" data-to="40">1–40</button>
        <button data-from="41" data-to="80">41–80</button>
        <button data-from="81" data-to="120">81–120</button>
        <button data-from="121" data-to="160">121–160</button>
        <button data-custom="1">自訂</button>
      </div>
      <div class="custom hidden" id="customRow">
        <input type="number" id="fromNo" inputmode="numeric" min="1" value="1">
        <span>–</span>
        <input type="number" id="toNo" inputmode="numeric" min="1" value="160">
      </div>
      <div class="hint" id="rangeHint"></div>
    </div>
    <div class="panel">
      <h2>題型</h2>
      <div class="grid2" id="typeGrid">
        <div class="chip on" data-type="choice"><span class="box"></span>選擇題</div>
        <div class="chip on" data-type="spell"><span class="box"></span>填空題</div>
        <div class="chip on" data-type="zh2en"><span class="box"></span>中翻英</div>
        <div class="chip on" data-type="en2zh"><span class="box"></span>英翻中</div>
        <div class="chip on wide" data-type="cloze"><span class="box"></span>例句填空</div>
      </div>
    </div>
    <div class="panel">
      <h2>題數</h2>
      <div class="count-row" id="countRow">
        <button data-n="20" class="on">20 題</button>
        <button data-n="40">40 題</button>
        <button data-n="0">範圍內全部</button>
      </div>
    </div>
    <button class="start" id="startBtn">開始測驗</button>
  </div>

  <div id="quiz" class="hidden">
    <div id="scoreBox"></div>
    <div id="questions"></div>
  </div>

  <div class="foot">中翻英/英翻中只考單字 · 例句填空每次隨機換句子</div>
</div>

<div class="bar hidden" id="bar">
  <div class="inner" id="barInner">
    <button class="btn-ghost" id="backBtn">重設</button>
    <button class="btn-check" id="checkBtn">一鍵對答案</button>
  </div>
</div>

const TYPE_LABEL = {choice:"選擇題",spell:"填空題",zh2en:"中翻英",en2zh:"英翻中",cloze:"例句填空"};
const MAX_NO = WORDS.reduce((m,w)=>Math.max(m,w.no),0);
let picked = {choice:true,spell:true,zh2en:true,en2zh:true,cloze:true};
let count = 20;
let rangeFrom = 1, rangeTo = MAX_NO;
let questions = [];
let graded = false;

function inRange(){return WORDS.filter(w=>w.no>=rangeFrom&&w.no<=rangeTo);}
function readCustom(){
  const f=document.getElementById('fromNo'), t=document.getElementById('toNo');
  let a=parseInt(f.value,10), b=parseInt(t.value,10);
  if(isNaN(a))a=1; if(isNaN(b))b=MAX_NO;
  a=Math.min(Math.max(a,1),MAX_NO); b=Math.min(Math.max(b,1),MAX_NO);
  if(a>b){const s=a;a=b;b=s;}
  f.value=a; t.value=b; rangeFrom=a; rangeTo=b;
}
function updateHint(){
  const n=inRange().length, m=count===0?n:Math.min(count,n);
  const short=count!==0&&count>n;
  const h=document.getElementById('rangeHint');
  h.className="hint"+(short||!n?" warn":"");
  h.innerHTML=n? `第 <b>${rangeFrom}–${rangeTo}</b> 號共 <b>${n}</b> 個單字，這次出 <b>${m}</b> 題`+(short?"（不足 "+count+" 題）":"")
                : `這個範圍<b>沒有單字</b>，請重新選擇`;
  document.getElementById('startBtn').disabled=!n;
}

document.querySelectorAll('#rangeRow button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#rangeRow button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const custom=!!b.dataset.custom;
    document.getElementById('customRow').classList.toggle('hidden',!custom);
    if(custom) readCustom();
    else if(b.dataset.all){ rangeFrom=1; rangeTo=MAX_NO; }
    else{ rangeFrom=parseInt(b.dataset.from,10); rangeTo=Math.min(parseInt(b.dataset.to,10),MAX_NO); }
    updateHint();
  });
});
['fromNo','toNo'].forEach(id=>{
  const el=document.getElementById(id); el.max=MAX_NO;
  el.addEventListener('change',()=>{readCustom();updateHint();});
});
document.getElementById('toNo').value=MAX_NO;

document.querySelectorAll('#typeGrid .chip').forEach(c=>{
  c.addEventListener('click',()=>{
    const t=c.dataset.type;
    if(c.classList.contains('on') && Object.values(picked).filter(Boolean).length===1) return;
    c.classList.toggle('on');
    picked[t]=c.classList.contains('on');
  });
});
document.querySelectorAll('#countRow button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#countRow button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); count=parseInt(b.dataset.n,10); updateHint();
  });
});
updateHint();
document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('checkBtn').addEventListener('click',check);
document.getElementById('backBtn').addEventListener('click',reset);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||"").toLowerCase().replace(/[\s.．,，、;；!?'"]/g,"").trim();}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function makeMask(w){
  const len=w.length; const styles=[];
  styles.push(i=> i===0);
  if(len>=4) styles.push(i=> i===0||i===len-1);
  styles.push(i=> "aeiou".includes(w[i]));
  styles.push(()=> Math.random()<0.45);
  const pick=styles[Math.floor(Math.random()*styles.length)];
  let reveal=w.split("").map((_,i)=>!!pick(i));
  if(!reveal.some(Boolean)) reveal[0]=true;
  if(reveal.every(Boolean)) reveal[Math.floor(len/2)]=false;
  if(len<=2) reveal=w.split("").map((_,i)=>i===0);
  return w.split("").map((ch,i)=> reveal[i]?ch:"＿").join(" ");
}

function checkBar(){
  document.getElementById('barInner').innerHTML=
    `<button class="btn-ghost" id="backBtn">重設</button>`+
    `<button class="btn-check" id="checkBtn">一鍵對答案</button>`;
  document.getElementById('checkBtn').addEventListener('click',check);
  document.getElementById('backBtn').addEventListener('click',reset);
}

function start(){
  const types=Object.keys(picked).filter(t=>picked[t]);
  const scope=inRange(); if(!scope.length) return;
  const pool=shuffle(scope).slice(0,count===0?scope.length:count);
  questions=pool.map((w,i)=>{
    let type=types[Math.floor(Math.random()*types.length)];
    if(type==="cloze" && (!w.ex||!w.ex.length)) type="spell";
    const q={idx:i,type,w,ans:null};
    if(type==="choice"){
      let others=shuffle(scope.filter(x=>x.no!==w.no)).slice(0,3);
      if(others.length<3) others=shuffle(WORDS.filter(x=>x.no!==w.no)).slice(0,3);
      q.dir = Math.random()<0.5 ? "en2zh":"zh2en";
      if(q.dir==="en2zh"){ q.prompt=w.en; q.options=shuffle([w,...others]).map(x=>x.zh); q.correct=w.zh; }
      else{ q.prompt=w.zh; q.options=shuffle([w,...others]).map(x=>x.en); q.correct=w.en; }
    }else if(type==="spell"){
      q.mask=makeMask(w.en);
    }else if(type==="cloze"){
      q.sentence=w.ex[Math.floor(Math.random()*w.ex.length)];
    }
    return q;
  });
  graded=false;
  document.getElementById('scoreBox').innerHTML="";
  checkBar();
  render();
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('bar').classList.remove('hidden');
  document.getElementById('hdrSub').textContent=`第 ${rangeFrom}–${rangeTo} 號 · ${questions.length} 題，作答完按下方「一鍵對答案」。`;
  window.scrollTo(0,0);
}

function render(){
  const box=document.getElementById('questions'); box.innerHTML="";
  questions.forEach(q=>{
    const w=q.w; const el=document.createElement('div');
    el.className="q"; el.id="q"+q.idx;
    let promptHTML="", bodyHTML="";
    if(q.type==="choice"){
      promptHTML=`<div class="prompt">${esc(q.prompt)}</div>`;
      bodyHTML=`<div class="opts">`+q.options.map((o,k)=>
        `<div class="opt" data-opt="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></div>`).join("")+`</div>`;
    }else if(q.type==="spell"){
      promptHTML=`<div class="prompt">${esc(w.zh)}<small class="blanks">${q.mask}　（${w.en.length} 個字母）</small></div>`;
      bodyHTML=`<input type="text" autocomplete="off" autocapitalize="none" placeholder="拼出完整單字…">`;
    }else if(q.type==="zh2en"){
      promptHTML=`<div class="prompt">${esc(w.zh)}</div>`;
      bodyHTML=`<input type="text" autocomplete="off" autocapitalize="none" placeholder="輸入英文單字…">`;
    }else if(q.type==="en2zh"){
      promptHTML=`<div class="prompt">${esc(w.en)}</div>`;
      bodyHTML=`<input type="text" autocomplete="off" placeholder="輸入中文意思…">`;
    }else if(q.type==="cloze"){
      const sent=esc(q.sentence).replace("{}",`<span class="blank"></span>`);
      promptHTML=`<div class="prompt cloze">${sent}<small>（${esc(w.zh)}）</small></div>`;
      bodyHTML=`<input type="text" autocomplete="off" autocapitalize="none" placeholder="填入這個單字…">`;
    }
    el.innerHTML=`<div class="q-top"><span class="q-num">${q.idx+1}</span><span class="q-type">${TYPE_LABEL[q.type]}</span></div>${promptHTML}${bodyHTML}`;
    box.appendChild(el);
    if(q.type==="choice"){
      el.querySelectorAll('.opt').forEach(op=>{
        op.addEventListener('click',()=>{
          if(graded)return;
          el.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
          op.classList.add('sel');
          q.ans=q.options[parseInt(op.dataset.opt,10)];
        });
      });
    }
  });
}

function isRight(q){
  if(q.type==="choice") return q.ans===q.correct;
  const input=document.querySelector('#q'+q.idx+' input');
  const val=input?input.value:"";
  if(q.type==="spell"||q.type==="zh2en"||q.type==="cloze") return norm(val)===norm(q.w.en);
  if(q.type==="en2zh"){ const n=norm(val); if(!n)return false; return q.w.keys.some(k=>norm(k)===n); }
  return false;
}

function check(){
  graded=true; let score=0;
  questions.forEach(q=>{
    const el=document.getElementById('q'+q.idx);
    const ok=isRight(q); q.right=ok; if(ok)score++;
    el.classList.add(ok?"correct":"wrong");
    const input=el.querySelector('input'); if(input) input.readOnly=true;
    if(q.type==="choice"){
      el.querySelectorAll('.opt').forEach(op=>{
        const txt=op.querySelector('span:last-child').textContent;
        op.style.pointerEvents="none";
        if(txt===q.correct) op.classList.add('ans');
        else if(op.classList.contains('sel')) op.classList.add('badpick');
      });
    }
    const v=document.createElement('div');
    v.className="verdict "+(ok?"ok":"no");
    v.innerHTML=`<span class="dot">${ok?"✓":"✕"}</span>${ok?"答對":"再看一次"}`;
    el.appendChild(v);
    if(q.type!=="choice"){
      const a=document.createElement('div'); a.className="answer";
      if(q.type==="en2zh"){
        a.innerHTML=`正解：<b>${esc(q.w.zh)}</b>`;
      }else if(q.type==="cloze"){
        const filled=esc(q.sentence).replace("{}",`<b>${esc(q.w.en)}</b>`);
        a.innerHTML=`正解：<b>${esc(q.w.en)}</b>　${esc(q.w.zh)}<br>${filled}`;
      }else{
        a.innerHTML=`正解：<b>${esc(q.w.en)}</b>　${esc(q.w.zh)}`;
      }
      el.appendChild(a);
    }
    if(q.type==="en2zh" && !ok){
      const s=document.createElement('div'); s.className="selfscore";
      s.innerHTML=`我寫的其實對嗎？ <button data-i="${q.idx}">算我答對</button>`;
      el.appendChild(s);
      s.querySelector('button').addEventListener('click',(e)=>{
        const b=e.target;
        if(b.classList.contains('on')){ b.classList.remove('on'); b.textContent="算我答對"; q.right=false; }
        else{ b.classList.add('on'); b.textContent="✓ 已算對"; q.right=true; }
        updateScore();
      });
    }
  });
  updateScore();
  document.getElementById('barInner').innerHTML=
    `<button class="btn-ghost" id="backBtn2">重新設定</button>`+
    `<button class="btn-dark" id="againBtn">再測一次</button>`;
  document.getElementById('backBtn2').addEventListener('click',reset);
  document.getElementById('againBtn').addEventListener('click',start);
  document.getElementById('scoreBox').scrollIntoView({behavior:"smooth",block:"start"});
}

function updateScore(){
  const total=questions.length;
  const score=questions.filter(q=>q.right).length;
  const pct=Math.round(score/total*100);
  let msg="繼續加油！";
  if(pct===100)msg="滿分！這幾個字穩了 🎉";
  else if(pct>=80)msg="很不錯，錯的幾題再複習就好。";
  else if(pct>=60)msg="有底子了，把紅框的字補起來。";
  document.getElementById('scoreBox').innerHTML=
    `<div class="score"><div class="big"><span>${score}</span> / ${total}</div><div class="lbl">答對 ${pct}%　·　${msg}</div></div>`;
}

function reset(){
  document.getElementById('setup').classList.remove('hidden');
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('bar').classList.add('hidden');
  document.getElementById('scoreBox').innerHTML="";
  document.getElementById('questions').innerHTML="";
  checkBar();
  updateHint();
  document.getElementById('hdrSub').textContent="選好範圍、題型和題數，開始練習。";
  window.scrollTo(0,0);
}
</script>
